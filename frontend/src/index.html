<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RBC Portfolio Tracker</title>
  <meta name="description" content="Self-directed investing portfolio dashboard">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link id="favicon" rel="icon" type="image/x-icon" href="assets/public/favicon_rbc.ico">
  <script>
    window.addEventListener("load", function(){
      window.cookieconsent.initialise({
        "palette": {
          "popup": { "background": "var(--theme-primary)", "text": "var(--theme-text)" },
          "button": { "background": "var(--theme-accent)", "text": "var(--theme-text)" }
        },
        "theme": "classic",
        "position": "bottom-right",
        "content": { "message": "This demo uses cookies to keep your session and watchlist preferences.", "dismiss": "Got it", "link": "Privacy details", "href": "/#/privacy-security/privacy-policy" }
      })});
  </script>
</head>
<body class="rbc-blue-gold-theme">
  <app-root></app-root>
</body>
</html>
